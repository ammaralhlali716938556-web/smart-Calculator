name: Build Abu Asad Calculator APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🦁 بناء تطبيق حاسبة أبو أسد (APK)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 جلب الكود المصدري (Checkout)
        uses: actions/checkout@v4

      - name: ☕ تثبيت بيئة جافا (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 إعداد وتجهيز جريدل (Setup Gradle)
        uses: gradle/actions/setup-gradle@v3

      - name: ⚙️ تجهيز وتشغيل تصريح gradlew
        run: |
          chmod +x gradlew || true
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "جاري توليد gradle-wrapper.jar عبر بيئة جيت هوب..."
            gradle wrapper --gradle-version 8.5 || true
            chmod +x gradlew || true
          fi

      - name: 🔨 تجميع وبناء ملف APK (Assemble Debug APK)
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: 📦 تجهيز ملف APK للتحميل المباشر
        run: |
          mkdir -p release_output
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "تم العثور على التطبيق في: $APK_FILE"
          cp "$APK_FILE" "release_output/AbuAsad_Calculator_v1.0.apk"

      - name: 🚀 رفع ملف APK كملف مرفق للتحميل (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AbuAsad_Calculator_v1.0_APK
          path: release_output/AbuAsad_Calculator_v1.0.apk
          retention-days: 30

      - name: 🌟 إنشاء Release رسمي في جيت هوب (GitHub Release)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "🦁 تطبيق حاسبة أبو أسد - الإصدار 1.0.0"
          body: |
            ## 🦁 تطبيق حاسبة أبو أسد (Abu Asad Calculator)
            
            تم بناء ملف التطبيق **APK** بنجاح بواسطة **GitHub Actions** وهو جاهز الآن للتنزيل والتثبيت على هاتفك مباشرة!

            ### ✨ المميزات:
            - **تصميم ملكي فاخر**: واجهة كلاسيكية عصرية بطابع الأسد الذهبي.
            - **شعار مميز**: أيقونة الأسد الملكية في أعلى التطبيق وأيقونة البرنامج.
            - **العمليات الحسابية الأربعة**: الجمع (+)، الطرح (−)، الضرب (×)، القسمة (÷).
            - **حماية تامة من الأخطاء**: معالجة القسمة على صفر، والأرقام العشرية، وحذف الأرقام (Backspace).
            - **توافق شامل**: يعمل بسلاسة تامة على هواتف أندرويد من الإصدار 5 وحتى أحدث إصدارات أندرويد الحالية والمستقبلية.

            ---
            ### 📥 طريقة التحميل:
            اضغط على ملف `AbuAsad_Calculator_v1.0.apk` في قسم Assets بالأسفل لتثبيته فوراً.
          files: release_output/AbuAsad_Calculator_v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
