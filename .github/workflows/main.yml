          files["app/src/main/res/drawable/badge_lion_bg.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="@color/bg_header_badge" />
