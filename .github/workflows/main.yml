name: Build Abu Asad Calculator APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🦁 بناء تطبيق حاسبة أبو أسد (APK)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 جلب الكود
        uses: actions/checkout@v4

      - name: ☕ تثبيت بيئة جافا (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 تثبيت وإعداد Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: ⚙️ تجهيز وبرمجة كامل ملفات حاسبة أبو أسد تلقائياً
        run: |
          python3 - << 'EOF'
          import os

          files = {}

          # 1. settings.gradle
          files["settings.gradle"] = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AbuAsadCalculator"
          include ':app'
          """

          # 2. build.gradle
          files["build.gradle"] = """plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          """

          # 3. gradle.properties
          files["gradle.properties"] = """org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          """

          # 4. app/build.gradle
          files["app/build.gradle"] = """plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.abuasad.calculator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.abuasad.calculator"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
                  vectorDrawables {
                      useSupportLibrary true
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      applicationIdSuffix ""
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          """

          # 5. AndroidManifest.xml
          files["app/src/main/AndroidManifest.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_lion"
                  android:roundIcon="@drawable/ic_lion"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AbuAsadCalculator">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """

          # 6. Strings
          files["app/src/main/res/values/strings.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">حاسبة أبو أسد</string>
              <string name="app_title">حاسبة أبو أسد</string>
              <string name="app_subtitle">ABU ASAD CALCULATOR • فخامة ودقة</string>
              <string name="error_divide_zero">لا يمكن القسمة على صفر</string>
          </resources>
          """

          # 7. Colors
          files["app/src/main/res/values/colors.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_main">#0E1117</color>
              <color name="bg_header_badge">#1C2333</color>
              <color name="bg_display">#161B26</color>
              <color name="display_border">#2C3549</color>
              <color name="lion_gold">#FFB300</color>
              <color name="lion_gold_light">#FFD54F</color>
              <color name="lion_gold_dark">#E69500</color>
              <color name="lion_amber">#FFA000</color>
              <color name="btn_number_bg">#1B202D</color>
              <color name="btn_number_pressed">#283042</color>
              <color name="btn_number_text">#FFFFFF</color>
              <color name="btn_op_bg">#E5A93B</color>
              <color name="btn_op_pressed">#C48E28</color>
              <color name="btn_op_text">#0E1117</color>
              <color name="btn_action_bg">#252C3D</color>
              <color name="btn_action_pressed">#353E54</color>
              <color name="btn_action_text">#E2E8F0</color>
              <color name="btn_clear_text">#FF6B6B</color>
