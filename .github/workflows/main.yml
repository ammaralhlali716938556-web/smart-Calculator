          files["app/src/main/res/drawable/btn_action_bg.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_pressed="true"><shape><solid android:color="@color/btn_action_pressed" /><corners android:radius="20dp" /></shape></item>
              <item><shape><solid android:color="@color/btn_action_bg" /><corners android:radius="20dp" /></shape></item>
          </selector>
          """

          files["app/src/main/res/drawable/btn_equal_bg.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_pressed="true"><shape><solid android:color="@color/btn_equal_pressed" /><corners android:radius="20dp" /></shape></item>
              <item><shape><gradient android:angle="45" android:startColor="@color/lion_amber" android:endColor="@color/lion_gold_light" /><corners android:radius="20dp" /></shape></item>
          </selector>
          """

          # 10. Layout (activity_main.xml)
          files["app/src/main/res/layout/activity_main.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
