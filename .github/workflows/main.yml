                  <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_marginBottom="8dp" android:layout_weight="1">
                      <androidx.appcompat.widget.AppCompatButton android:id="@+id/btnClear" android:layout_width="0dp" android:layout_height="match_parent" android:layout_margin="4dp" android:layout_weight="1" android:background="@drawable/btn_action_bg" android:text="C" android:textColor="@color/btn_clear_text" android:textSize="22sp" android:textStyle="bold" />
