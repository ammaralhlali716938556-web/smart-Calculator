          """

          files["app/src/main/res/drawable/display_background.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="@color/bg_display" />
              <corners android:radius="24dp" />
              <stroke android:width="1.5dp" android:color="@color/display_border" />
