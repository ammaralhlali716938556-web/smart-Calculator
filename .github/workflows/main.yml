              <path android:fillColor="#151922" android:pathData="M50,4 C75.4,4 96,24.6 96,50 C96,75.4 75.4,96 50,96 C24.6,96 4,75.4 4,50 C4,24.6 24.6,4 50,4 Z" />
              <path android:fillColor="#E5A93B" android:pathData="M50,8 L58,18 L68,12 L72,23 L83,21 L83,32 L93,35 L89,46 L97,52 L89,59 L95,67 L85,71 L88,80 L77,81 L75,91 L65,88 L58,96 L50,90 L42,96 L35,88 L25,91 L23,81 L12,80 L15,71 L5,67 L11,59 L3,52 L11,46 L7,35 L17,32 L17,21 L28,23 L32,12 L42,18 Z" />
              <path android:fillColor="#C68615" android:pathData="M50,14 L56,22 L65,18 L68,27 L78,26 L77,35 L86,39 L82,48 L89,53 L81,59 L85,67 L76,69 L77,77 L68,78 L65,86 L57,82 L50,88 L43,82 L35,86 L32,78 L23,77 L24,69 L15,67 L19,59 L11,53 L18,48 L14,39 L23,35 L22,26 L32,27 L35,18 L44,22 Z" />
