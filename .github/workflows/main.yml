name: Build Abu Asad Calculator APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🦁 بناء تطبيق حاسبة أبو أسد (APK)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 جلب الكود
        uses: actions/checkout@v4

      - name: ☕ تثبيت JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 تثبيت Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: ⚙️ تجهيز بيئة البناء
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: 🔨 بناء ملف الـ APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 تجهيز ملف التطبيق
        run: |
          mkdir -p apk_output
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_FILE" "apk_output/AbuAsad_Calculator.apk"

      - name: 🚀 رفع ملف الـ APK للتحميل المباشر
        uses: actions/upload-artifact@v4
        with:
          name: AbuAsad_Calculator_APK
          path: apk_output/AbuAsad_Calculator.apk
          retention-days: 30

      - name: 🌟 إنشاء Release رسمي
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0"
          name: "🦁 حاسبة أبو أسد - الإصدار 1.0"
          body: "تم بناء التطبيق بنجاح بصيغة APK جاهز للتحميل والتثبيت المباشر."
          files: apk_output/AbuAsad_Calculator.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
