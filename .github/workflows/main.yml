          # 11. MainActivity.java
          files["app/src/main/java/com/abuasad/calculator/MainActivity.java"] = """package com.abuasad.calculator;

          import android.os.Bundle;
          import android.view.HapticFeedbackConstants;
          import android.view.View;
          import android.widget.Button;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import java.math.BigDecimal;
          import java.math.RoundingMode;
          import java.text.DecimalFormat;
          import java.text.DecimalFormatSymbols;
          import java.util.Locale;

          public class MainActivity extends AppCompatActivity {
              private TextView tvExpression, tvResult;
              private String currentInput = "0";
              private BigDecimal firstOperand = null;
              private String pendingOperator = null;
              private boolean isOperatorJustPressed = false;
              private boolean isCalculationFinished = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  tvExpression = findViewById(R.id.tvExpression);
                  tvResult = findViewById(R.id.tvResult);

                  int[] numIds = {R.id.btn0, R.id.btn1, R.id.btn2, R.id.btn3, R.id.btn4, R.id.btn5, R.id.btn6, R.id.btn7, R.id.btn8, R.id.btn9};
                  for (int id : numIds) {
                      findViewById(id).setOnClickListener(v -> {
                          v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP);
                          appendDigit(((Button) v).getText().toString());
                      });
                  }
                  findViewById(R.id.btnDot).setOnClickListener(v -> { v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP); appendDot(); });
                  findViewById(R.id.btnAdd).setOnClickListener(v -> { v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP); handleOp("+"); });
                  findViewById(R.id.btnSubtract).setOnClickListener(v -> { v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP); handleOp("−"); });
                  findViewById(R.id.btnMultiply).setOnClickListener(v -> { v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP); handleOp("×"); });
                  findViewById(R.id.btnDivide).setOnClickListener(v -> { v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP); handleOp("÷"); });
                  findViewById(R.id.btnEquals).setOnClickListener(v -> { v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP); calculate(); });
                  findViewById(R.id.btnClear).setOnClickListener(v -> { v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP); clear(); });
                  findViewById(R.id.btnBackspace).setOnClickListener(v -> { v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP); backspace(); });
                  findViewById(R.id.btnPlusMinus).setOnClickListener(v -> { v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP); toggleSign(); });
                  findViewById(R.id.btnPercent).setOnClickListener(v -> { v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP); percent(); });
              }

              private void appendDigit(String d) {
                  if (isCalculationFinished) clear();
                  if (isOperatorJustPressed) { currentInput = d; isOperatorJustPressed = false; }
                  else { currentInput = "0".equals(currentInput) ? d : currentInput + d; }
                  tvResult.setText(currentInput);
              }

              private void appendDot() {
                  if (isCalculationFinished) clear();
                  if (isOperatorJustPressed) { currentInput = "0."; isOperatorJustPressed = false; }
                  else if (!currentInput.contains(".")) { currentInput += "."; }
                  tvResult.setText(currentInput);
              }

              private void handleOp(String op) {
                  if (firstOperand == null || isCalculationFinished) {
                      firstOperand = new BigDecimal(currentInput);
                  } else if (!isOperatorJustPressed) {
                      firstOperand = execute(firstOperand, pendingOperator, new BigDecimal(currentInput));
                      if (firstOperand == null) { tvResult.setText(getString(R.string.error_divide_zero)); clear(); return; }
                      tvResult.setText(firstOperand.stripTrailingZeros().toPlainString());
                  }
                  pendingOperator = op;
                  isOperatorJustPressed = true;
                  isCalculationFinished = false;
                  tvExpression.setText(firstOperand.stripTrailingZeros().toPlainString() + " " + op);
              }

              private void calculate() {
                  if (firstOperand == null || pendingOperator == null || isOperatorJustPressed) return;
                  BigDecimal second = new BigDecimal(currentInput);
                  BigDecimal res = execute(firstOperand, pendingOperator, second);
                  if (res == null) { tvResult.setText(getString(R.string.error_divide_zero)); clear(); return; }
                  tvExpression.setText(firstOperand.stripTrailingZeros().toPlainString() + " " + pendingOperator + " " + second.stripTrailingZeros().toPlainString() + " =");
                  currentInput = res.stripTrailingZeros().toPlainString();
                  tvResult.setText(currentInput);
                  firstOperand = null;
                  pendingOperator = null;
                  isCalculationFinished = true;
              }

              private BigDecimal execute(BigDecimal a, String op, BigDecimal b) {
                  try {
                      switch (op) {
                          case "+": return a.add(b);
                          case "−": return a.subtract(b);
                          case "×": return a.multiply(b);
                          case "÷": return b.compareTo(BigDecimal.ZERO) == 0 ? null : a.divide(b, 10, RoundingMode.HALF_UP).stripTrailingZeros();
                          default: return b;
                      }
                  } catch (Exception e) { return null; }
              }

              private void toggleSign() {
                  if (!"0".equals(currentInput)) {
                      currentInput = currentInput.startsWith("-") ? currentInput.substring(1) : "-" + currentInput;
                      tvResult.setText(currentInput);
                  }
              }

              private void percent() {
                  try {
                      currentInput = new BigDecimal(currentInput).divide(new BigDecimal("100"), 10, RoundingMode.HALF_UP).stripTrailingZeros().toPlainString();
                      tvResult.setText(currentInput);
                  } catch (Exception ignored) {}
              }

              private void backspace() {
                  if (currentInput.length() > 1) { currentInput = currentInput.substring(0, currentInput.length() - 1); }
                  else { currentInput = "0"; }
                  tvResult.setText(currentInput);
              }

              private void clear() {
                  currentInput = "0";
                  firstOperand = null;
                  pendingOperator = null;
                  isOperatorJustPressed = false;
                  isCalculationFinished = false;
                  tvExpression.setText("");
                  tvResult.setText("0");
              }
          }
          """

          for path, content in files.items():
              os.makedirs(os.path.dirname(path) if os.path.dirname(path) else ".", exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content.strip() + "\n")

          print("All Abu Asad Calculator project files generated successfully!")
          EOF

      - name: ⚙️ تجهيز وإعداد Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: 🔨 بناء ملف APK الرسمي
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 استخراج ملف APK
        run: |
          mkdir -p apk_output
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "تم العثور على التطبيق: $APK_FILE"
          cp "$APK_FILE" "apk_output/AbuAsad_Calculator.apk"

      - name: 🚀 رفع ملف الـ APK للتحميل المباشر (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AbuAsad_Calculator_APK
          path: apk_output/AbuAsad_Calculator.apk
          retention-days: 30

      - name: 🌟 إنشاء Release رسمي في جيت هوب
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0"
          name: "🦁 حاسبة أبو أسد - الإصدار 1.0"
          body: "تم بناء التطبيق بنجاح بصيغة APK جاهز للتحميل والتثبيت المباشر على الهاتف."
          files: apk_output/AbuAsad_Calculator.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
