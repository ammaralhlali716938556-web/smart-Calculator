          """

          files["app/src/main/res/drawable/btn_number_bg.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_pressed="true"><shape><solid android:color="@color/btn_number_pressed" /><corners android:radius="20dp" /></shape></item>
