                      <androidx.appcompat.widget.AppCompatButton android:id="@+id/btnDivide" android:layout_width="0dp" android:layout_height="match_parent" android:layout_margin="4dp" android:layout_weight="1" android:background="@drawable/btn_operator_bg" android:text="÷" android:textColor="@color/btn_op_text" android:textSize="26sp" android:textStyle="bold" />
                  </LinearLayout>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_marginBottom="8dp" android:layout_weight="1">
                      <androidx.appcompat.widget.AppCompatButton android:id="@+id/btn7" android:layout_width="0dp" android:layout_height="match_parent" android:layout_margin="4dp" android:layout_weight="1" android:background="@drawable/btn_number_bg" android:text="7" android:textColor="@color/btn_number_text" android:textSize="24sp" android:textStyle="bold" />
                      <androidx.appcompat.widget.AppCompatButton android:id="@+id/btn8" android:layout_width="0dp" android:layout_height="match_parent" android:layout_margin="4dp" android:layout_weight="1" android:background="@drawable/btn_number_bg" android:text="8" android:textColor="@color/btn_number_text" android:textSize="24sp" android:textStyle="bold" />
                      <androidx.appcompat.widget.AppCompatButton android:id="@+id/btn9" android:layout_width="0dp" android:layout_height="match_parent" android:layout_margin="4dp" android:layout_weight="1" android:background="@drawable/btn_number_bg" android:text="9" android:textColor="@color/btn_number_text" android:textSize="24sp" android:textStyle="bold" />
                      <androidx.appcompat.widget.AppCompatButton android:id="@+id/btnMultiply" android:layout_width="0dp" android:layout_height="match_parent" android:layout_margin="4dp" android:layout_weight="1" android:background="@drawable/btn_operator_bg" android:text="×" android:textColor="@color/btn_op_text" android:textSize="26sp" android:textStyle="bold" />
